{% extends "base.html" %}
{% block title %}Analyse Webcam{% endblock %}

{% block body %}

<div class="container">

    <h2>📷 Analyse des émotions</h2>
    <p class="muted">La webcam analyse vos émotions en temps réel pendant la session.</p>

    <!-- WEBCAM -->
    <div style="text-align:center; margin-top:20px;">
        <video id="webcamVideo" autoplay playsinline
               style="width:100%; border-radius:12px; border:1px solid var(--border);"></video>
        <canvas id="webcamCanvas" style="display:none;"></canvas>
    </div>

    <!-- STATUT -->
    <div class="card" style="margin-top:16px; text-align:center;">
        <p id="webcamStatus" class="muted">⏳ Initialisation de la webcam...</p>
        <p id="emotionResult" style="font-size:1.5rem; font-weight:bold; margin:0;"></p>
        <p id="confidenceResult" class="muted" style="font-size:0.85rem;"></p>
    </div>

    <!-- HISTORIQUE -->
    <div class="card" style="margin-top:16px;">
        <h3 style="margin-top:0;">Historique des émotions</h3>
        <div id="emotionHistory" style="display:flex; flex-direction:column; gap:8px;">
            <p class="muted" id="noHistory">Aucune émotion détectée pour l'instant.</p>
        </div>
    </div>

    <!-- BOUTON ARRÊT -->
    <button class="btn secondary" onclick="stopWebcam()" style="margin-top:16px;">
        ⏹ Arrêter la webcam
    </button>

</div>

<script>

/* ============================================================
   VARIABLES
============================================================ */

const SESSION_ID = Number("{{ session_id }}");
const WEBCAM_FREQ = Number("{{ freq_webcam }}") * 1000;

let webcamStream = null;
let webcamInterval = null;

const emotionEmojis = {
    "happy":     "😊 Heureux",
    "sad":       "😢 Triste",
    "angry":     "😠 En colère",
    "fear":      "😨 Peur",
    "surprise":  "😲 Surpris",
    "disgust":   "🤢 Dégoût",
    "neutral":   "😐 Neutre"
};

/* ============================================================
   DÉMARRAGE WEBCAM
============================================================ */

async function startWebcam() {
    try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById("webcamVideo");
        video.srcObject = webcamStream;

        document.getElementById("webcamStatus").innerText = "✅ Webcam active — analyse en cours...";

        // Lancer la capture à intervalles réguliers
        webcamInterval = setInterval(captureAndAnalyze, WEBCAM_FREQ);

    } catch (err) {
        document.getElementById("webcamStatus").innerText = "❌ Webcam non disponible ou refusée.";
        console.warn("Erreur webcam :", err);
    }
}

/* ============================================================
   CAPTURE ET ANALYSE
============================================================ */

async function captureAndAnalyze() {
    const video = document.getElementById("webcamVideo");
    const canvas = document.getElementById("webcamCanvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const imageData = canvas.toDataURL("image/jpeg", 0.7);

    try {
        const res = await fetch("/analyze_webcam", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                session_id: SESSION_ID,
                image: imageData
            })
        });

        const data = await res.json();

        if (data.ok) {
            const label = emotionEmojis[data.emotion] || data.emotion;

            // Mise à jour statut
            document.getElementById("emotionResult").innerText = label;
            document.getElementById("confidenceResult").innerText = 
                `Confiance : ${data.confidence}%`;

            // Ajout dans l'historique
            addToHistory(label, data.confidence);
        } else {
            document.getElementById("webcamStatus").innerText = 
                "⚠️ Analyse échouée : " + (data.error || "erreur inconnue");
        }

    } catch (e) {
        console.warn("Erreur analyse webcam :", e);
    }
}

/* ============================================================
   HISTORIQUE
============================================================ */

function addToHistory(emotion, confidence) {
    const history = document.getElementById("emotionHistory");
    const noHistory = document.getElementById("noHistory");

    if (noHistory) noHistory.remove();

    const now = new Date().toLocaleTimeString("fr-FR");

    const entry = document.createElement("div");
    entry.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: var(--surface);
        border-radius: 8px;
        font-size: 0.9rem;
    `;
    entry.innerHTML = `
        <span>${emotion}</span>
        <span class="muted">${confidence}%</span>
        <span class="muted">${now}</span>
    `;

    history.prepend(entry);

    // Garder max 10 entrées
    const entries = history.querySelectorAll("div");
    if (entries.length > 10) {
        entries[entries.length - 1].remove();
    }
}

/* ============================================================
   ARRÊT WEBCAM
============================================================ */

function stopWebcam() {
    if (webcamStream) {
        webcamStream.getTracks().forEach(t => t.stop());
    }
    if (webcamInterval) {
        clearInterval(webcamInterval);
    }
    document.getElementById("webcamVideo").srcObject = null;
    document.getElementById("webcamStatus").innerText = "⏹ Webcam arrêtée.";
}

// Arrêter automatiquement si on quitte la page
window.addEventListener("beforeunload", stopWebcam);

/* ============================================================
   LANCEMENT AUTO
============================================================ */

startWebcam();

</script>

{% endblock %}
